<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonetics Admin</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="config.js"></script><script defer src="admin.js"></script>
<style>
.admin-shell{max-width:1100px;margin:40px auto;padding:0 20px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.admin-panel{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:22px;margin:22px 0}.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.admin-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}.admin-form input,.admin-form textarea{border:1px solid #dfe4ec;border-radius:8px;padding:11px}.admin-list{display:grid;gap:14px}.admin-item{border:1px solid #e5e8ef;border-radius:12px;padding:16px}.admin-item h3{margin:0 0 6px}.admin-meta{font-size:12px;color:#687389;white-space:pre-wrap}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.admin-actions button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.approve{background:#e0f4e9;color:#176944}.reject{background:#fbe6e6;color:#9c2525}.admin-status{font-size:12px;min-height:20px;color:#9c2525}.hidden{display:none!important}@media(max-width:600px){.admin-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">P</span><span class="brand-word">phonetics<span>.</span><small>ADMIN CONSOLE</small></span></a><a href="index.html">← Storefront</a></header>
<main class="admin-shell">
<div class="admin-top"><div><div class="eyebrow">PRIVATE WORKSPACE</div><h1>Admin dashboard</h1><p>Review seller submissions. Only authorized admin UUIDs should be able to access private data.</p></div><button class="button button-dark" id="logout" type="button">Sign out</button></div>
<section class="admin-panel" id="loginPanel"><h2>Admin sign in</h2><form id="loginForm" class="admin-form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-gold" type="submit">Sign in</button></form><p id="loginMessage" class="admin-status" role="status"></p></section>
<section class="admin-panel hidden" id="dashboardPanel"><div class="admin-top"><h2>Pending seller submissions</h2><button id="refresh" class="button button-outline" style="color:#17223a;border-color:#dfe4ec" type="button">Refresh</button></div><p id="dashboardMessage" class="admin-status" role="status"></p><div id="submissions" class="admin-list"></div></section>
</main>
</body></html>
